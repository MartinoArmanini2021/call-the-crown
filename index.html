         apple- tags for iOS). The status bar is see-through over the navy header, which keeps clear of
         it with env(safe-area-inset-top) (.safe-top in src/styles.css). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Final Prediction" />

    <meta name="description" content="Guess every match of the ATP Finals in Turin, 15–22 November: the winner and the score. Make a league and beat your friends. Free, no betting." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Final Prediction" />
    <meta property="og:title" content="Guess every match of the ATP Finals" />

    <meta property="og:image:width" content="1200" />
