# Local Supabase (`supabase start`). Only what differs from the CLI's defaults, plus what the brief
# requires: email one-time codes (6 digits), no links, no social sign-in. Staging and production get the
# same Auth settings in their dashboards (README, "Auth settings per instance").
project_id = "six-kings-game"

# Ports 55320-55329, not Supabase's default 54320-54329: Windows (with WSL / Hyper-V) reserves the
# 54146-54345 block on this machine, so the defaults cannot bind ("ports are not available").
# Check yours with: netsh interface ipv4 show excludedportrange protocol=tcp

[api]
port = 55321
schemas = ["public"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
port = 55329

[db.seed]
enabled = true
# Local only: the event, the simulated clock, then the invented players and schedule.
sql_paths = ["./events/sixkings_2026.sql", "./dev/sim_clock.sql", "./dev/seed_local.sql"]

[studio]
port = 55323

[local_smtp]
port = 55324

[analytics]
port = 55327

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
# Password sign-in after the first code (Tino, 3 Oct 2026). Production adds leaked-password
# protection (Pro plan, dashboard → Authentication → Attack protection).
minimum_password_length = 8

# Local only: the default (2 emails an hour) blocks a walkthrough. Production sets its own limit
# for the sign-up rush (plan, section e).
[auth.rate_limit]
email_sent = 100

[auth.email]
enable_signup = true
# The 6-digit code confirms the address; there is no separate confirmation link.
enable_confirmations = false
otp_length = 6
otp_expiry = 600

# The sign-in email carries the code only, never a link (links break inside in-app browsers).
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Your sign-in code"
content_path = "./supabase/templates/code.html"

# -----------------------------------------------------------------------------------------------------
# Staging (Phase 2): project six-kings-game-staging, Frankfurt. Inherits everything above; only these
# differ. Apply with `bunx supabase config push --project-ref rmjlqqzytahmdlmnwxfc`.
# Email: Supabase's built-in sender for now (delivers only to members of the Supabase organisation, a
# few an hour); the custom sender (Resend on Tino's domain) arrives in Phase 3.
[remotes.staging]
project_id = "rmjlqqzytahmdlmnwxfc"

[remotes.staging.auth]
site_url = "https://preview.six-kings-game.pages.dev"

[remotes.staging.auth.rate_limit]
email_sent = 2

[remotes.staging.db.seed]
enabled = false
