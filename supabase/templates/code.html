<!-- The sign-in email: the 6-digit code only, no link. Brand text is replaced per instance (Phase 3). -->
<div style="background:#0b0b0b;padding:32px;font-family:Arial,sans-serif;color:#ffffff;text-align:center">
  <p style="margin:0 0 16px;font-size:14px;color:#c9c9c9">Your sign-in code</p>
  <p style="margin:0;font-size:36px;font-weight:800;letter-spacing:8px">{{ .Token }}</p>
  <p style="margin:16px 0 0;font-size:12px;color:#9c9c9c">It expires in 10 minutes. If you did not ask for it, ignore this email.</p>
</div>
